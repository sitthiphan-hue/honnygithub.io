<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำตัว - สิทธิพันธ์ พานทอง (ไอซ์)</title>
    <!-- นำเข้า Google Fonts ภาษาไทย (Kanit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e1e24;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #2a2a35;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 50px;
            border: 3px solid #ff4757;
        }

        h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .nickname {
            color: #ff4757;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .education {
            background-color: #2a2a35;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: #b3b3b3;
        }

        .interests-title {
            text-align: left;
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #ffffff;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }

        .interests-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            list-style: none;
        }

        .interest-item {
            background-color: #252530;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            border-left: 3px solid #ff4757;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- รูปโปรไฟล์สมมติ (สามารถเปลี่ยนไอคอนเป็น <img> ของตัวเองได้) -->
        <img src="8axHupcx_400x400.jpg" class="profile-img">

        <!-- ชื่อ-นามสกุล และชื่อเล่น -->
        <h1>นาย สิทธิพันธ์ พานทอง</h1>
        <div class="nickname">ชื่อเล่น: ไอซ์</div>

        <!-- ประวัติการศึกษา -->
        <div class="education">
            🎓 นักศึกษาชั้น ปวส.2<br>
            🏫 วิทยาลัยเทคนิคนางรอง
        </div>

        <!-- สิ่งที่สนใจ -->
        <div class="interests-title">🎯 สิ่งที่สนใจ (Interests)</div>
        <ul class="interests-list">
            <li class="interest-item">🎵 ดนตรี</li>
            <li class="interest-item">🎧 เสียงเพลง</li>
            <li class="interest-item">🎬 ตัดต่อ</li>
            <li class="interest-item">💀 เรื่องสยองขวัญ</li>
        </ul>
    </div>

</body>
</html>
